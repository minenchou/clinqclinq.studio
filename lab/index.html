  <script>
    window.PAGE_ZH = {
      page_h1: '互動<span class="tint">知識</span>',
      page_lede: '探索抽象與微觀世界。'
    };

    (function () {
      var SECTION = 'lab';
      var grid = document.getElementById('workGrid');
      var bar = document.getElementById('workFilters');
      var list = WORKS.filter(function (t) { return t.section === SECTION; });
      var current = 'all';
      try { var h = location.hash.slice(1); if (TOPICS[h]) current = h; } catch (e) {}
      function render() {
        var zh = document.documentElement.lang === 'zh-Hant';
        var counts = { all: list.length };
        list.forEach(function (t) { counts[t.topic] = (counts[t.topic] || 0) + 1; });
        var keys = Object.keys(TOPICS).filter(function (k) { return counts[k]; });
        bar.hidden = keys.length < 2;
        bar.innerHTML = ['all'].concat(keys).map(function (k) {
          var label = k === 'all' ? (zh ? '全部' : 'All') : (zh ? TOPICS[k].zh : TOPICS[k].en);
          return '<button type="button" data-k="' + k + '" aria-pressed="' + (k === current) + '">' + label + '<span class="n">' + counts[k] + '</span></button>';
        }).join('');
        grid.innerHTML = workCardsHTML(list, '../', zh, current);
      }
      bar.addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        current = b.getAttribute('data-k');
        history.replaceState(null, '', current === 'all' ? location.pathname : '#' + current);
        render();
      });
      window.__renderWorks = render;
      render();
    })();

    (function () {
      var lists = document.querySelectorAll('.tl');
      var ACTIVE = 1;
      function paint() {
        lists.forEach(function (ul) {
          var links = ul.querySelectorAll('a');
          links.forEach(function (a, i) {
            a.classList.toggle('active', i === ACTIVE);
            a.classList.toggle('passed', i < ACTIVE);
          });
          ul.style.setProperty('--fill', (links[ACTIVE].offsetTop - links[0].offsetTop) + 'px');
        });
      }
      window.__updateNav = paint;
      window.addEventListener('resize', paint);
      paint();
    })();
  </script>
