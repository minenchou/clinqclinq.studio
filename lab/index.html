  <script>
    window.SITE_ICONS = {
      nav:    '',
      emblem: '',
      work1:  '',
      work2:  '',
      work3:  ''
    };

    (function () {
      var I = window.SITE_ICONS || {};
      function pick(spec) {
        if (!spec) return '';
        if (typeof spec === 'string') return spec;
        var dark = document.documentElement.getAttribute('data-theme') === 'dark';
        return (dark && spec.dark) || spec.light || spec.dark || '';
      }
      function tryLoad(src, ok) {
        if (!src) return;
        var t = new Image();
        t.onload = function () { ok(src); };
        t.src = src;
      }
      function setSlots() {
        document.querySelectorAll('[data-icon]').forEach(function (host) {
          tryLoad(pick(I[host.getAttribute('data-icon')]), function (src) {
            var img = host.querySelector('img.custom-icon');
            if (!img) {
              img = document.createElement('img');
              img.className = 'custom-icon'; img.alt = ''; img.decoding = 'async';
              host.appendChild(img);
            }
            img.src = src;
            host.classList.add('has-custom');
          });
        });
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', setSlots);
      else setSlots();
      window.__setIcons = setSlots;
    })();
  </script>

  <script>
    window.PALETTES = [
      { id: 'soda',     name: 'Sphere Soda',     zh: '球形汽水' },
      { id: 'flame-cs', name: 'Flame Test',      zh: '焰色反應' },
      { id: 'ice',      name: 'Ice & Glass',     zh: '冰晶玻璃' },
      { id: 'clink',    name: 'Clink Hour',      zh: '乾杯時刻' },
      { id: 'specimen', name: 'Specimen',        zh: '礦物標本' },
      { id: 'classic',  name: 'Classic',         zh: '經典簡約' }
    ];
    (function () {
      var p = 'soda';
      try { p = localStorage.getItem('palette') || 'soda'; } catch (e) {}
      var ok = window.PALETTES.some(function (x) { return x.id === p; });
      document.documentElement.setAttribute('data-palette', ok ? p : 'soda');
      var t = 'light';
      try { t = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

    :root { --serif: "Source Serif 4", "Noto Serif TC", "Songti TC", Georgia, serif; }

    ::selection { background: var(--lemon-soft); color: var(--ink); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    html { background: var(--bg); }
    body { background: linear-gradient(180deg, var(--blush) 0, var(--bg) 620px) no-repeat, var(--bg); color: var(--ink);
           min-height: 100vh;
           font: 400 16px/1.7 var(--serif);
           font-optical-sizing: auto; -webkit-font-smoothing: antialiased;
           transition: background-color .25s, color .25s; }
    html[lang="zh-Hant"] body { line-height: 1.85; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 88px 24px 64px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .fab { position: fixed; top: 20px; z-index: 30;
           width: 40px; height: 40px; border-radius: 50%;
           display: grid; place-items: center;
           border: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 85%, transparent);
           -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
           color: var(--ink); font: 600 14px/1 var(--serif);
           letter-spacing: 0.02em; cursor: pointer;
           transition: border-color .15s, color .15s, transform .15s, background-color .15s; }
    .fab:hover { border-color: var(--accent); color: var(--accent); }
    .fab:active { transform: scale(0.94); }
    .fab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .lang-toggle { right: 20px; }

    .palette-toggle { right: 20px; top: 72px; }
    .palette-toggle svg { width: 18px; height: 18px; display: block; }
    .palette-toggle .p1 { fill: var(--accent); }
    .palette-toggle .p2 { fill: var(--pink); }
    .palette-toggle .p3 { fill: var(--lemon); }
    .palette-toggle svg { transition: transform .35s ease; }

    .theme-toggle { right: 20px; top: 124px; }
    .theme-toggle svg { width: 18px; height: 18px; display: block; fill: none; stroke: currentColor;
                        stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; transition: transform .35s ease; }
    .theme-toggle .sun { display: none; }
    :root[data-theme="dark"] .theme-toggle .sun { display: block; }
    :root[data-theme="dark"] .theme-toggle .moon { display: none; }

    .menu-toggle { right: 20px; }
    .menu-toggle .bars { position: relative; width: 16px; height: 12px; }
    .menu-toggle .bars span { position: absolute; left: 0; width: 100%; height: 1.5px; border-radius: 2px; background: currentColor;
                              transition: transform .22s ease, opacity .15s ease, top .22s ease; }
    .menu-toggle .bars span:nth-child(1) { top: 0; }
    .menu-toggle .bars span:nth-child(2) { top: 5.25px; }
    .menu-toggle .bars span:nth-child(3) { top: 10.5px; }
    .menu-toggle[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); background: var(--soft); }
    .menu-toggle[aria-expanded="true"] .bars span:nth-child(1) { top: 5.25px; transform: rotate(45deg); }
    .menu-toggle[aria-expanded="true"] .bars span:nth-child(2) { opacity: 0; }
    .menu-toggle[aria-expanded="true"] .bars span:nth-child(3) { top: 5.25px; transform: rotate(-45deg); }

    .tl { list-style: none; position: relative; --dotbg: var(--bg); --fill: 0px; }
    .tl::before, .tl::after { content: ""; position: absolute; left: 5px; top: 17px; width: 1px; }
    .tl::before { bottom: 17px; background: color-mix(in srgb, var(--accent) 28%, var(--line)); }
    .tl::after { height: var(--fill); background: var(--accent); transition: height .3s ease; }
    .tl a { display: flex; align-items: center; gap: 14px; padding: 7px 0;
            color: var(--muted); font-size: 12px; font-weight: 500; line-height: 21px;
            letter-spacing: 0.11em; text-transform: uppercase; white-space: nowrap;
            transition: color .15s; }
    html[lang="zh-Hant"] .tl a { font-size: 13px; letter-spacing: 0.16em; }
    .tl a:hover { color: var(--accent); text-decoration: none; }
    .tl .dot { position: relative; z-index: 1; flex: none; width: 11px; height: 11px; border-radius: 50%;
               border: 1.5px solid color-mix(in srgb, var(--accent) 50%, var(--line)); background: var(--dotbg);
               transition: background-color .2s, border-color .2s, box-shadow .2s, transform .2s; }
    .tl a:hover .dot { border-color: var(--accent); }
    .tl a.passed .dot { border-color: var(--accent); }
    .tl a.active { color: var(--accent); }
    .tl a.active .dot { background: var(--pink); border-color: var(--pink);
                        box-shadow: 0 0 0 4px color-mix(in srgb, var(--pink) 22%, transparent); }
    .tl a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

    .nav-home { display: flex; align-items: center; gap: 14px; padding: 7px 0; margin-bottom: 6px;
                font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: 18px; line-height: 24px;
                letter-spacing: 0.01em; color: var(--ink); white-space: nowrap; transition: color .15s; }
    .nav-home:hover { color: var(--accent); text-decoration: none; }
    .nav-home .hico { flex: none; width: 11px; height: 16px; display: flex; align-items: center; justify-content: center; }
    .nav-home .hico img, .nav-home .hico svg { flex: none; width: 16px; height: 16px; display: block; transition: transform .2s; }
    .nav-home .hico svg .c { fill: none; stroke: currentColor; }
    .nav-home .hico svg .d { fill: currentColor; }
    .nav-home:hover .hico img, .nav-home:hover .hico svg { transform: rotate(-8deg); }
    .nav-home:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

    .top-home { position: fixed; top: 20px; left: 20px; z-index: 30; height: 40px; margin: 0; padding: 0 14px 0 12px;
                gap: 10px; border-radius: 20px;
                background: color-mix(in srgb, var(--bg) 92%, transparent);
                -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
    .top-home .hico { width: 18px; height: 18px; }
    .top-home .hico img, .top-home .hico svg { width: 18px; height: 18px; }

    .sidenav { display: none; position: fixed; top: 84px; z-index: 20; }
    .sidenav .tl a { color: var(--faint); }
    .sidenav .tl a:not(.active):not(.passed) .dot { border-color: color-mix(in srgb, var(--accent) 30%, var(--line)); }
    .sidenav .tl a:hover, .sidenav .tl a.active { color: var(--accent); }

    .menu-panel { position: fixed; top: 70px; left: 20px; z-index: 25; width: 236px;
                  padding: 14px 18px 12px; border-radius: 14px;
                  background: var(--soft);
                  border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line));
                  box-shadow: 0 12px 32px -12px color-mix(in srgb, var(--accent) 40%, transparent);
                  opacity: 0; visibility: hidden; transform: translateY(-6px) scale(.98); transform-origin: top left;
                  transition: opacity .18s ease, transform .18s ease, visibility 0s linear .18s; }
    .menu-panel.open { opacity: 1; visibility: visible; transform: none;
                       transition: opacity .18s ease, transform .18s ease, visibility 0s; }
    .menu-panel .tl { --dotbg: var(--soft); }
    .menu-panel .tl a { padding: 8px 0; font-size: 13px; color: var(--body); }
    .menu-panel .tl a.active { color: var(--accent); }
    .menu-scrim { position: fixed; inset: 0; z-index: 24; background: color-mix(in srgb, var(--bg) 88%, transparent);
                  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
                  opacity: 0; visibility: hidden; transition: opacity .18s ease, visibility 0s linear .18s; }
    .menu-scrim.open { opacity: 1; visibility: visible; transition: opacity .18s ease, visibility 0s; }

    @media (max-width: 1023px) {
      .palette-toggle { top: 72px; }
      .theme-toggle { top: 124px; }
      .lang-toggle { top: 176px; }
      .theme-toggle, .lang-toggle { opacity: 0; visibility: hidden; transform: translateY(-6px);
                     transition: opacity .18s ease, transform .18s ease, visibility 0s linear .18s, border-color .15s, color .15s; }
      body.menu-open .theme-toggle, body.menu-open .lang-toggle { opacity: 1; visibility: visible; transform: none;
                                    transition: opacity .18s ease, transform .18s ease, visibility 0s, border-color .15s, color .15s; }
      .menu-panel { top: 232px; left: auto; right: 34.5px; width: auto; padding: 0;
                    background: none; border: 0; border-radius: 0; box-shadow: none; transform-origin: top right; }
      .menu-panel .tl { --dotbg: var(--bg); }
      .menu-panel .tl::before, .menu-panel .tl::after { left: auto; right: 5px; }
      .menu-panel .tl a { flex-direction: row-reverse; justify-content: flex-start; text-align: right; }
    }

    @media (min-width: 1024px) {
      .sidenav { display: block; left: 32px; }
      .menu-toggle, .menu-panel, .menu-scrim, .top-home { display: none; }
      .wrap { margin-left: 208px; margin-right: auto; }
    }
    @media (min-width: 1360px) {
      .sidenav { left: calc((100vw - 880px) / 2 - 196px); }
      .wrap { margin: 0 auto; }
    }

    :root {
      --emblem-size: 200px;   --emblem-x: 0px;   --emblem-y: -16px;
      --emblem-size-m: 64px; --emblem-x-m: 0px; --emblem-y-m: 0px;
    }

    header { display: grid; grid-template-columns: 1fr max(160px, var(--emblem-size)); gap: 40px; align-items: start; }
    h1 { font-family: Fraunces, Georgia, serif; font-weight: 300; font-size: clamp(30px, 6vw, 46px);
         line-height: 1.1; letter-spacing: -0.02em; text-box: trim-start cap alphabetic; }
    .lede { margin-top: 16px; color: var(--muted); font-size: 17px; max-width: 540px; }
    .links { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 15px; }
    .links a { color: var(--ink); background: linear-gradient(transparent 62%, var(--lemon-soft) 62%);
               padding: 0 2px; transition: color .15s, background-color .15s; }
    .links a:hover { color: var(--pink); text-decoration: none; }
    section > p a:hover {
      color: var(--pink);
      background-size: 100% 100%;
      text-decoration: none;
    }
    h1 .tint { color: var(--accent); }
    .emblem { width: max(160px, var(--emblem-size)); display: grid; place-items: center; padding-top: 4px; }
    .crystal, .emblem .custom-icon { width: var(--emblem-size); height: var(--emblem-size);
                                     transform: translate(var(--emblem-x), var(--emblem-y)); }
    .crystal { overflow: visible; }
    .crystal .c { fill: none; stroke: var(--accent); transition: stroke .25s; }
    .crystal .d { fill: var(--pink); transition: fill .25s; }

    section { margin-top: 56px; scroll-margin-top: 32px; }
    header + section { margin-top: 48px; }
    h2 { font-size: 13px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);

    html[lang="zh-Hant"] h2 { font-size: 14px; letter-spacing: 0.18em; }
    section > p { color: var(--body); max-width: 640px; }
    section > p + p { margin-top: 14px; }

    .interests { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 18px 40px; }
    .interests li { display: grid; grid-template-columns: 40px 1fr; gap: 16px; align-items: start; }
    .interests .icon { width: 40px; height: 40px; border-radius: 8px; background: var(--soft); margin-top: 4px;
                       display: grid; place-items: center; color: var(--accent); }
    .interests .icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
    .interests li:nth-child(3n+2) .icon { background: var(--pink-soft); color: var(--pink); }
    .interests li:nth-child(3n+3) .icon { background: var(--lemon-soft); color: var(--lemon); }
    .interests.three { grid-template-columns: repeat(3, 1fr); gap: 18px 32px; }
    .interests.three li { grid-template-columns: 1fr; gap: 12px; align-content: start; }
    .interests strong { font-family: var(--serif); font-weight: 600; font-size: 17px; display: block; }
    .interests span { color: var(--muted); font-size: 15px; line-height: 1.6; display: block; }

    [data-icon].has-custom > :not(.custom-icon) { display: none; }
    .custom-icon { display: block; object-fit: contain; }
    .interests .icon .custom-icon { width: 22px; height: 22px; }

    .page-head { display: block; }
    .page-head .lede { max-width: 600px; }
    .page-head + section { margin-top: 40px; }
    footer { margin-top: 72px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }

    @media (max-width: 640px) {
      .wrap { padding: 64px 16px 48px; }
      .fab { top: 14px; }
      .lang-toggle, .menu-toggle, .palette-toggle, .theme-toggle { right: 14px; }
      .top-home { top: 14px; left: 14px; }
      .palette-toggle { top: 62px; }
      .theme-toggle { top: 110px; }
      .lang-toggle { top: 158px; }
      .menu-panel { top: 212px; right: 28.5px; }
      section { scroll-margin-top: 68px; }
      header { grid-template-columns: 1fr; gap: 24px; }
      .emblem { width: auto; place-items: start; order: -1; padding-top: 0; }
      .crystal, .emblem .custom-icon { width: var(--emblem-size-m); height: var(--emblem-size-m);
                                       transform: translate(var(--emblem-x-m), var(--emblem-y-m)); }
      h1 { text-box: none; }
      .interests, .interests.three { grid-template-columns: 1fr; }
      .interests.three li { grid-template-columns: 40px 1fr; gap: 16px; }
    }
    @media (min-width: 641px) and (max-width: 1023px) {
      section { scroll-margin-top: 72px; }
    }
  </style>

      <div>
        <h1 data-i18n="page_h1">Interactive <span class="tint">physics</span></h1>
        <p class="lede" data-i18n="page_lede">Tools that turn up during research.</p>
      </div>

    <section id="works">
      <div class="work-filters" id="workFilters" role="group" aria-label="Filter" hidden></div>
      <div class="work-grid" id="workGrid"></div>
    </section>

  <script src="../works.js"></script>
  <script>
    (function () {
      var SECTION = 'lab';
      var grid = document.getElementById('workGrid');
      var bar = document.getElementById('workFilters');
      var list = WORKS.filter(function (t) { return t.section === SECTION; });
      var current = 'all';
      try { var h = location.hash.slice(1); if (TOPICS[h]) current = h; } catch (e) {}
      function render() {
        var zh = document.documentElement.lang === 'zh-Hant';
        var counts = { all: list.length };
        list.forEach(function (t) { counts[t.topic] = (counts[t.topic] || 0) + 1; });
        var keys = Object.keys(TOPICS).filter(function (k) { return counts[k]; });
        bar.hidden = keys.length < 2;
        bar.innerHTML = ['all'].concat(keys).map(function (k) {
          var label = k === 'all' ? (zh ? '全部' : 'All') : (zh ? TOPICS[k].zh : TOPICS[k].en);
          return '<button type="button" data-k="' + k + '" aria-pressed="' + (k === current) + '">' + label + '<span class="n">' + counts[k] + '</span></button>';
        }).join('');
        grid.innerHTML = workCardsHTML(list, '../', zh, current);
      }
      bar.addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        current = b.getAttribute('data-k');
        history.replaceState(null, '', current === 'all' ? location.pathname : '#' + current);
        render();
      });
      window.__renderWorks = render;
      render();
    })();

    document.getElementById('y').textContent = new Date().getFullYear();

    var menuBtn = document.getElementById('menuToggle');
    var menuPanel = document.getElementById('menuPanel');
    var menuScrim = document.getElementById('menuScrim');

    (function () {
      var list = window.PALETTES;
      var btn = document.getElementById('paletteToggle');
      var turns = 0;
      function idx() {
        var cur = document.documentElement.getAttribute('data-palette');
        for (var i = 0; i < list.length; i++) if (list[i].id === cur) return i;
        return 0;
      }
      function label() {
        var p = list[idx()];
        var zh = document.documentElement.lang === 'zh-Hant';
        var t = zh ? '配色：' + p.zh + '（按下換色）' : 'Palette: ' + p.name + ' (click for next)';
        btn.setAttribute('aria-label', t);
        btn.title = t;
      }
      window.__updatePaletteLabel = label;
      btn.addEventListener('click', function () {
        var next = list[(idx() + 1) % list.length].id;
        document.documentElement.setAttribute('data-palette', next);
        try { localStorage.setItem('palette', next); } catch (e) {}
        turns += 1;
        btn.querySelector('svg').style.transform = 'rotate(' + turns * 120 + 'deg)';
        label();
      });
      label();
    })();

    (function () {
      var btn = document.getElementById('themeToggle');
      var turns = 0;
      function label() {
        var dark = document.documentElement.getAttribute('data-theme') === 'dark';
        var zh = document.documentElement.lang === 'zh-Hant';
        var t = dark ? (zh ? '切換為淺色模式' : 'Switch to light mode') : (zh ? '切換為深色模式' : 'Switch to dark mode');
        btn.setAttribute('aria-label', t);
        btn.title = t;
        btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
      }
      window.__updateThemeLabel = label;
      btn.addEventListener('click', function () {
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        turns += 1;
        btn.querySelector('svg').style.transform = 'rotate(' + turns * 360 + 'deg)';
        if (window.__setIcons) window.__setIcons();
        label();
      });
      label();
    })();

    (function () {
      var ZH = {
        lede: 'clinqclinq 是一間以元素、物理與萬物之美為題的小工作室，做一些好玩的東西。介於藝術與一堂課之間。',
        nav_work: '作品',
        page_h1: '互動<span class="tint">物理</span>',
        page_lede: '研究途中做出來的小工具。',
        nav_lab: '互動物理',
        nav_series: '創作系列',
        nav_about: '關於',
        nav_contact: '聯絡',
        h_work: '在這裡發生的事',
        w1_t: '互動物理',
        w1_d: '研究途中做出來的小工具。',
        w1_more: '進入實驗室 →',
        w2_t: '創作系列',
        w2_d: '持續進行中的作品。',
        w2_more: '看創作系列 →',
        w3_t: '線下體驗',
        w3_d: '走出螢幕世界，期待。',
        h_featured: '精選',
        h_about: '關於',
        about1: 'clinqclinq 由 Elsa Chou 經營。她是實驗物理出身的研究者，投入以 AI 驅動超冷原子系統的研究，也希望讓量子概念變得可見。這間工作室容納了這些事情好玩的一面。',
        about2: '更多關於她的研究，請見 <a href="https://minenchou.github.io/">minenchou.github.io</a>。',
        h_contact: '聯絡方式',
        contact_intro: '合作邀約歡迎來信 elsaxchou[a]gmail.com</a>。'
      };

      var nodes = document.querySelectorAll('[data-i18n]');
      var EN = [];
      nodes.forEach(function (el, i) { EN[i] = el.innerHTML; });
      var btn = document.getElementById('langToggle');

      function apply(lang) {
        var zh = lang === 'zh';
        nodes.forEach(function (el, i) {
          var k = el.getAttribute('data-i18n');
          el.innerHTML = zh && ZH[k] != null ? ZH[k] : EN[i];
        });
        document.documentElement.lang = zh ? 'zh-Hant' : 'en';
        btn.textContent = zh ? 'EN' : '中';
        var label = zh ? 'Switch to English' : '切換為中文';
        btn.setAttribute('aria-label', label);
        btn.title = label;
        menuBtn.setAttribute('aria-label', zh ? '選單' : 'Sections');
        if (window.__updatePaletteLabel) window.__updatePaletteLabel();
        if (window.__updateThemeLabel) window.__updateThemeLabel();
        try { localStorage.setItem('lang', lang); } catch (e) {}
        if (window.__renderWorks) window.__renderWorks();
        if (window.__updateNav) window.__updateNav();
      }

      var initial = 'en';
      var q = new URLSearchParams(location.search).get('lang');
      if (q === 'zh' || q === 'en') initial = q;
      else { try { initial = localStorage.getItem('lang') || 'en'; } catch (e) {} }
      if (initial === 'zh') apply('zh');

      btn.addEventListener('click', function () {
        apply(document.documentElement.lang === 'zh-Hant' ? 'en' : 'zh');
      });
    })();

    (function () {
      var lists = document.querySelectorAll('.tl');
      var ACTIVE = 1;
      function paint() {
        lists.forEach(function (ul) {
          var links = ul.querySelectorAll('a');
          links.forEach(function (a, i) {
            a.classList.toggle('active', i === ACTIVE);
            a.classList.toggle('passed', i < ACTIVE);
          });
          ul.style.setProperty('--fill', (links[ACTIVE].offsetTop - links[0].offsetTop) + 'px');
        });
      }
      window.__updateNav = paint;
      window.addEventListener('resize', paint);
      paint();

      function setMenu(open) {
        menuPanel.classList.toggle('open', open);
        menuScrim.classList.toggle('open', open);
        document.body.classList.toggle('menu-open', open);
        menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
        if (open) requestAnimationFrame(paint);
      }
      menuBtn.addEventListener('click', function () { setMenu(menuBtn.getAttribute('aria-expanded') !== 'true'); });
      menuScrim.addEventListener('click', function () { setMenu(false); });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && menuPanel.classList.contains('open')) { setMenu(false); menuBtn.focus(); }
      });
    })();
  </script>
</body>
