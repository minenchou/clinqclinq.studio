<style>
  :root{
    --ink:#dbe6f0;
    --dim:#7d8b99;
    --line:rgba(150,180,210,.22);
    --panel:rgba(8,11,17,.82);
    --st:env(safe-area-inset-top,0px);
    --sb:env(safe-area-inset-bottom,0px);
    --sl:env(safe-area-inset-left,0px);
    --sr:env(safe-area-inset-right,0px);
    --edge:28px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang TC","Noto Sans TC",sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased}
  html,body{overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  #app{position:fixed;inset:0}
  canvas{display:block;touch-action:none;-webkit-touch-callout:none}

  .noselect{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent}
  button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}

  body .cq-bar{height:calc(40px + var(--st));padding-top:var(--st);
    padding-left:max(18px,var(--sl));padding-right:max(18px,var(--sr))}
  @media (max-width:520px){
    body .cq-bar{padding-left:max(14px,var(--sl));padding-right:max(14px,var(--sr))}
  }

  :root{
    --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
    --serif:"Qh Serif","EB Garamond",Garamond,Georgia,"Times New Roman",serif;
  }

  .lockup .t{font-family:var(--sans);font-weight:200;text-transform:uppercase;
    letter-spacing:.34em;margin-right:-.34em;color:#e6eef5;line-height:1}
  .lockup .s{font-family:var(--serif);font-weight:400;letter-spacing:.07em;
    margin-right:-.07em;color:#aebbc6;line-height:1.2}

  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;background:#000;z-index:20;cursor:pointer;
    transition:opacity .6s ease;padding-bottom:4vh;touch-action:manipulation}
  #boot.gone{opacity:0;pointer-events:none}
  #boot .t{font-size:clamp(22px,2.6vw,34px)}
  #boot .s{margin-top:clamp(14px,1.4vw,20px);font-size:clamp(15px,1.3vw,18px)}
  @property --breath{syntax:"<number>";inherits:false;initial-value:0}
  @property --lift{syntax:"<number>";inherits:false;initial-value:0}
  #boot .g{margin-top:clamp(44px,6.5vh,68px);font-family:var(--serif);font-weight:500;
    font-size:clamp(14px,1.15vw,16px);letter-spacing:.14em;margin-right:-.14em;
    padding:8px 14px 8px calc(14px + .14em);color:#8e9daa;
    --b:calc(.4 + .6 * var(--breath));
    opacity:calc(var(--b) + (1 - var(--b)) * var(--lift));
    animation:breathe 3.4s ease-in-out infinite;
    transition:--lift .35s ease,color .35s ease,text-shadow .35s ease}
  #boot .g:hover{--lift:1;color:#e6eef5;text-shadow:0 0 14px rgba(200,220,240,.35)}
  @keyframes breathe{0%,100%{--breath:0}50%{--breath:1}}

  #title{position:fixed;left:0;right:0;bottom:calc(38px + var(--sb));text-align:center;pointer-events:none;
    opacity:0;transition:opacity 1.2s ease .4s}
  #title.on{opacity:1}
  #title .t{font-size:clamp(20px,1.9vw,26px)}
  #title .s{margin-top:12px;font-size:clamp(14px,1.15vw,17px)}

  #readout{position:fixed;left:0;right:0;top:calc(74px + var(--st));text-align:center;pointer-events:none;
    font-family:var(--serif);font-weight:500;font-size:clamp(18px,1.55vw,22px);letter-spacing:.03em;
    color:#dde7ef;opacity:0;transition:opacity .6s ease;white-space:nowrap;
    font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1}
  #readout.on{opacity:1}
  #readout .sub{display:block;margin-top:8px;font-size:.72em;letter-spacing:.1em;color:#9fadb9}

  #legend{position:fixed;left:calc(var(--edge) + var(--sl));bottom:calc(38px + var(--sb));pointer-events:none;
    font-family:var(--serif);font-weight:500;font-size:14px;line-height:1.7;
    letter-spacing:.04em;color:#7f8d99;opacity:0;transition:opacity 1.2s ease .6s}
  #legend.on{opacity:.75}
  #legend > div{display:flex;gap:16px}
  #legend b{font-weight:600;color:#aab8c4;flex:0 0 172px}
  @media (max-width:820px), (hover:none){ #legend{display:none} }

  #sound,#steer{position:fixed;right:calc(var(--edge) + var(--sr));bottom:calc(38px + var(--sb));
    width:38px;height:38px;padding:0;
    border-radius:50%;border:1px solid rgba(190,210,230,.5);background:rgba(10,14,20,.25);
    color:#dfe8ef;cursor:pointer;display:grid;place-items:center;
    opacity:0;pointer-events:none;transition:opacity 1.2s ease .6s,background-color .2s ease}
  #sound.on,#steer.on{opacity:1;pointer-events:auto}
  #sound.on:hover,#sound.on:focus-visible,#steer.on:hover,#steer.on:focus-visible{
    background:rgba(190,210,230,.1);outline:none}
  #sound svg,#steer svg{width:18px;height:18px;display:block}
  #sound .slash{display:none}
  #sound.muted .wave{display:none}
  #sound.muted .slash{display:inline}
  #legend .steer.active b,#legend .steer.active span{color:#e8b48e}

  #steer{display:none;right:auto;left:calc(var(--edge) + var(--sl))}
  @media (max-width:820px), (hover:none){ #steer{display:grid} }

  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { uDim: { value: 1 }, uAlpha: { value: 0.78 },

  vertexShader: `
    attribute float aAge;
    attribute float aSide;
    varying float vA;
    varying float vS;

    }`,
  fragmentShader: `
    uniform float uDim;
    uniform float uAlpha;
    uniform vec3 uHot;
    uniform vec3 uEdge;
    varying float vA;
    varying float vS;
    void main(){

const trailIndex = (() => {
  const idx = new Uint16Array((TRAIL_MAX - 1) * 6);
  for (let i = 0; i < TRAIL_MAX - 1; i++) {
    const a = i * 2;
    idx.set([a, a + 1, a + 2, a + 1, a + 3, a + 2], i * 6);
  }
  return new THREE.BufferAttribute(idx, 1);
})();
const _ta = new THREE.Vector3(), _tb = new THREE.Vector3(), _tc = new THREE.Vector3();

class Trail {
  constructor(parent, lifetime, material = trailMaterial) {
    this.lifetime = lifetime;
    this.pts = [];
    this.geo = new THREE.BufferGeometry();
    this.pos  = new Float32Array(TRAIL_MAX * 2 * 3);
    this.age  = new Float32Array(TRAIL_MAX * 2);
    this.side = new Float32Array(TRAIL_MAX * 2);
    for (let i = 0; i < TRAIL_MAX; i++) { this.side[i * 2] = -1; this.side[i * 2 + 1] = 1; }
    this.geo.setAttribute('position', new THREE.BufferAttribute(this.pos, 3));
    this.geo.setAttribute('aAge', new THREE.BufferAttribute(this.age, 1));
    this.geo.setAttribute('aSide', new THREE.BufferAttribute(this.side, 1));
    this.geo.setIndex(trailIndex);
    this.mesh = new THREE.Mesh(this.geo, material);
    this.mesh.frustumCulled = false;
    this.mesh.renderOrder = 5;
    parent.add(this.mesh);
    this.geo.setDrawRange(0, 0);
  }
  push(worldPoint, now) {
    const last = this.pts[this.pts.length - 1];
    if (last && last.p.distanceToSquared(worldPoint) < 0.000025) return;
    this.pts.push({ p: worldPoint.clone(), t: now });
    if (this.pts.length > TRAIL_MAX) this.pts.shift();
  }
  update(now) {
    while (this.pts.length && now - this.pts[0].t > this.lifetime) this.pts.shift();
    const n = this.pts.length;
    if (n < 2) { this.geo.setDrawRange(0, 0); return; }
    const cam = camera.position;
    for (let i = 0; i < n; i++) {
      const p = this.pts[i].p;
      const prev = this.pts[Math.max(0, i - 1)].p;
      const next = this.pts[Math.min(n - 1, i + 1)].p;
      _ta.subVectors(next, prev);
      _tb.subVectors(cam, p);
      _tc.crossVectors(_ta, _tb);
      const len = _tc.length();
      if (len > 1e-9) _tc.multiplyScalar(1 / len); else _tc.set(0, 1, 0);

      const age = clamp01((now - this.pts[i].t) / this.lifetime);
      const w = TRAIL_HALF_WIDTH * (1 - 0.55 * age);
      const o = i * 6;
      this.pos[o]     = p.x - _tc.x * w; this.pos[o + 1] = p.y - _tc.y * w; this.pos[o + 2] = p.z - _tc.z * w;
      this.pos[o + 3] = p.x + _tc.x * w; this.pos[o + 4] = p.y + _tc.y * w; this.pos[o + 5] = p.z + _tc.z * w;
      this.age[i * 2] = this.age[i * 2 + 1] = age;
    }
    this.geo.setDrawRange(0, (n - 1) * 6);
    this.geo.attributes.position.needsUpdate = true;
    this.geo.attributes.aAge.needsUpdate = true;
  }
  clear() { this.pts.length = 0; this.geo.setDrawRange(0, 0); }
}

      ? { marker: markerMat.clone(), halo: haloMat.clone(), vector: vectorMat.clone(),

    this.marker.position.set(0, 1, 0);
    this.marker.renderOrder = 6;

    this.haloSeed = Math.random() * Math.PI * 2;
    this.halo.scale.set(this.haloBase, this.haloBase, 1);

    this.vector.renderOrder = 4;
    this.group.add(this.vector);

  stateLocal() {
    _v.set(0, 1, 0).applyQuaternion(this.pivot.quaternion);
    return _v.clone().normalize();
  }
  thetaPhi() {
    const n = this.stateLocal();
    const b = toBloch(n);
    const theta = Math.acos(clamp(b.z, -1, 1));
    let phi = Math.atan2(b.y, b.x);
    if (phi < 0) phi += Math.PI * 2;
    return { theta, phi, n };
  }

  updateStateVisuals() {
    const { theta, phi } = this.thetaPhi();

    this.marker.getWorldPosition(_v);
    this.group.getWorldPosition(_v2);
    const mid = _v.clone().add(_v2).multiplyScalar(0.5);
    const dir = _v.clone().sub(_v2);
    const len = dir.length();
    if (len > 1e-6) {
      this.vector.position.copy(this.group.worldToLocal(mid.clone()));
      this.vector.quaternion.copy(_q.setFromUnitVectors(UP, dir.clone().normalize()));
      this.vector.scale.set(this.vectorRadius / this.group.scale.x,
                            len / this.group.scale.x,
                            this.vectorRadius / this.group.scale.x);
      this.vector.visible = true;
    } else this.vector.visible = false;

    const hue = phi / (Math.PI * 2);
    const t01 = theta / Math.PI;
    const sat = clamp01(Math.sin(theta));
    const val = lerp(1.0, 0.12, t01);
    const light = val * (1 - sat / 2);
    const satHSL = (light <= 0 || light >= 1) ? 0
                 : (val - light) / Math.min(light, 1 - light);
    const c = new THREE.Color().setHSL(hue, clamp01(satHSL), clamp01(light));

    this.sphereMat.color.copy(c);
    this.sphereMat.emissive.copy(c);
    this.sphereMat.opacity = this.sphereAlpha;
    this.sphereMat.emissiveIntensity = this.emissionStrength * 0.55;

  }

    const s = this.haloBase * (1 + 0.12 * Math.sin(now * 2.3 + this.haloSeed));
    this.halo.scale.set(s, s, 1);
    this.sphereMat.opacity = this.sphereAlpha * this.dim;
    this.sphereMat.emissiveIntensity = this.emissionStrength * 0.55 * this.dim;
    if (this.trailEmitting) { this.marker.getWorldPosition(_v); this.trail.push(_v, now); }

  }

  async animateGate(name) {
    const g = GATES[name];
    if (!g) return;

    if (g.special === 'measure') { await this.animateMeasurementCollapse(); return; }
    if (g.special === 'reset') { this.setStateDirectionInstant(new THREE.Vector3(0, 1, 0)); return; }

    const start = this.pivot.quaternion.clone();
    let target;
    if (g.composite) target = U_QUAT.clone().multiply(start);
    else {
      if (Math.abs(g.deg) < 1e-4) { this.updateStateVisuals(); await nextFrame(); return; }
      target = new THREE.Quaternion().setFromAxisAngle(g.axis, D2R(g.deg)).multiply(start);

    let elapsed = 0;
    while (elapsed < this.rotationDuration) {
      elapsed += await nextFrame();
      if (this.userControlled) { this.isAnimating = false; return; }

      if (g.composite) this.pivot.quaternion.slerpQuaternions(start, target, t);
      else this.pivot.quaternion.copy(
        new THREE.Quaternion().setFromAxisAngle(g.axis, D2R(g.deg) * t).multiply(start));

    this.updateStateVisuals();
    this.isAnimating = false;
  }

  async animateMeasurementCollapse() {
    const b = toBloch(this.stateLocal());
    const p0 = clamp01((b.z + 1) * 0.5);
    const dir = Math.random() < p0 ? AX_Z.clone() : AX_Z.clone().negate();
    this.setStateDirectionInstant(dir);
    await nextFrame();
  }

  setStateDirectionInstant(dir) {
    const d = dir.lengthSq() < 1e-6 ? UP.clone() : dir.clone().normalize();
    this.trail.clear();
    this.pivot.quaternion.copy(new THREE.Quaternion().setFromUnitVectors(UP, d));

  }

  async animateStateToDirection(dir, duration = this.rotationDuration) {
    const d = dir.lengthSq() < 1e-6 ? UP.clone() : dir.clone().normalize();
    const start = this.pivot.quaternion.clone();
    const target = new THREE.Quaternion().setFromUnitVectors(UP, d);

    let elapsed = 0;
    while (elapsed < duration) {
      elapsed += await nextFrame();
      this.pivot.quaternion.slerpQuaternions(start, target, ease(clamp01(elapsed / duration)));
      this.updateStateVisuals();
    }
    this.pivot.quaternion.copy(target);
    this.updateStateVisuals();
    this.isAnimating = false;
  }

  resetToZeroStateInstant() { this.setStateDirectionInstant(UP.clone()); }
}

const VOICE_BANK_SRC = `
class VoiceBank {
  constructor() {
    this.voices = [];
    this.master = 1;
    this.on = false;
    this.level = 0;
    this.fadeIn = 1.0;
    this.fadeOut = 0.35;
    this.env = 0;
    this.lim = 1;
  }
  handle(m) {
    if (m.type === 'init') {
      this.voices = m.voices.map(v => Object.assign({
        amp: 0, freq: v.mid, phase: 0, subPhase: 0,
        twinPhase: Math.random() * 6.283, detune: 0, width: 0,
        tAmp: 0, tFreq: v.mid,
      }, v));
    } else if (m.type === 'set') {
      const d = m.data;
      for (let i = 0; i < this.voices.length; i++) {
        const v = this.voices[i];
        v.tAmp = d[i * 2]; v.tFreq = d[i * 2 + 1];
      }
    } else if (m.type === 'master') {
      this.master = m.value;
      if ('on' in m) this.on = m.on;
      if (m.fadeIn) this.fadeIn = m.fadeIn;
      if (m.fadeOut) this.fadeOut = m.fadeOut;
    }
  }
  render(L, R, n, sr) {
    const TAU = Math.PI * 2;
    L.fill(0); if (R !== L) R.fill(0);
    if (!this.on && this.level <= 0) return;

    for (let k = 0; k < this.voices.length; k++) {
      const v = this.voices[k];
      const aStep = 1 - Math.exp(-v.ampSpeed / sr);
      const fStep = 1 - Math.exp(-v.freqSpeed / sr);
      const gl = 1 - Math.max(0, v.pan);
      const gr = 1 + Math.min(0, v.pan);
      const tl = gl * (1 - v.width), tr = gr * (1 + v.width);
      const twinRatio = Math.pow(2, v.detune / 1200);

      const b   = Math.min(2, Math.max(0, v.bright));
      const h2  = v.h2 * b;
      const h3  = v.h3 * Math.pow(b, 1.15);
      const h4  = v.h4 * Math.pow(b, 1.35);
      const sub = v.sub * (1.15 - 0.35 * Math.min(1, b));
      let norm = 1;
      if (v.normalize) {
        const total = 1 + Math.abs(sub) + Math.abs(h2) + Math.abs(h3) + Math.abs(h4)
                    + Math.abs(v.twin) * (1 + Math.abs(h2) * 0.5);
        if (total > 0.0001) norm = 1 / total;
      }

      for (let i = 0; i < n; i++) {
        v.amp    += (v.tAmp - v.amp) * aStep;
        v.freq   += (v.tFreq - v.freq) * fStep;

        let s = Math.sin(v.phase)
              + sub * Math.sin(v.subPhase)
              + h2  * Math.sin(2 * v.phase)
              + h3  * Math.sin(3 * v.phase)
              + h4  * Math.sin(4 * v.phase);

        let tw = v.twin * (Math.sin(v.twinPhase) + h2 * 0.5 * Math.sin(2 * v.twinPhase));

        s *= norm; tw *= norm;
        s *= v.amp;
        const t2 = tw * v.amp;

        L[i] += (s * gl + t2 * tl) * 0.5;
        R[i] += (s * gr + t2 * tr) * 0.5;

        v.twinPhase += TAU * v.freq * twinRatio / sr;
        if (v.twinPhase >= TAU) v.twinPhase -= TAU * Math.floor(v.twinPhase / TAU);
        v.phase    += TAU * v.freq / sr;
        v.subPhase += TAU * v.freq * 0.5 / sr;
        if (v.phase >= TAU) v.phase -= TAU * Math.floor(v.phase / TAU);
        if (v.subPhase >= TAU) v.subPhase -= TAU * Math.floor(v.subPhase / TAU);
      }
    }

    const upStep = 1 / (this.fadeIn * sr), downStep = 1 / (this.fadeOut * sr);
    const aLim  = 1 - Math.exp(-1 / (0.002 * sr));
    const rel   = Math.exp(-1 / (0.35 * sr));
    const CEIL  = 0.62;
    for (let i = 0; i < n; i++) {
      this.level = this.on ? Math.min(1, this.level + upStep) : Math.max(0, this.level - downStep);
      const g = this.master * this.level * this.level;
      let l = L[i] * g, r = R[i] * g;
      const pk = Math.max(Math.abs(l), Math.abs(r));
      this.env = pk > this.env ? pk : this.env * rel + pk * (1 - rel);
      const want = this.env > CEIL ? CEIL / this.env : 1;
      this.lim += (want - this.lim) * (want < this.lim ? aLim : (1 - rel));
      l *= this.lim; r *= this.lim;
      L[i] = Math.tanh(l * 1.1) / 1.1;
      if (R !== L) R[i] = Math.tanh(r * 1.1) / 1.1;
    }
  }
}

const VOICE_TIMBRE = {
  ampSpeed: 5, freqSpeed: 6, bright: 0.56,

const REVERB = { seconds: 3.2, rt60: 2.4, preDelay: 0.022, wet: 0.34, dry: 0.82,
                 lowCut: 170, highCut: 4200 };
function makeHallImpulse(ctx) {
  const sr = ctx.sampleRate, n = Math.floor(REVERB.seconds * sr);
  const pre = Math.floor(REVERB.preDelay * sr);

    const d = buf.getChannelData(ch);
    let lp = 0;
    for (let i = pre; i < n; i++) {
      const t = (i - pre) / sr;
      const env = Math.pow(10, -3 * t / REVERB.rt60);
      const k = 0.55 + 0.4 * Math.min(1, t / REVERB.rt60);
      lp += (1 - k) * ((Math.random() * 2 - 1) - lp);
      d[i] = lp * env;
    }

}

  const out = ctx.createGain();
  const dry = ctx.createGain(); dry.gain.value = REVERB.dry;
  input.connect(dry).connect(out);

  const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = REVERB.lowCut;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass';  lp.frequency.value = REVERB.highCut;
  const conv = ctx.createConvolver(); conv.buffer = makeHallImpulse(ctx);
  const wet = ctx.createGain(); wet.gain.value = REVERB.wet;
  input.connect(hp).connect(conv).connect(lp).connect(wet).connect(out);

  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -6; comp.knee.value = 6; comp.ratio.value = 4;
  comp.attack.value = 0.005; comp.release.value = 0.25;
  out.connect(comp);
  return comp;
}

      const blobUrl = URL.createObjectURL(new Blob([WORKLET_SRC], { type: 'text/javascript' }));
      for (const url of [dataUrl, blobUrl]) {
        try { node = await this._tryWorklet(url); this.mode = 'worklet'; break; }
        catch (err) {  }
      }
      URL.revokeObjectURL(blobUrl);
    }
    if (!node) { node = this._scriptProcessor(); this.mode = 'script'; }
    this.node = node;
    buildOutputChain(this.ctx, node).connect(this.ctx.destination);

    this.post({
      type: 'init',
      voices: this.mappers.map((m, k) => ({
        mid: m.range.mid, pan: m.pan, ...VOICE_TIMBRE,
        width: VOICE_TIMBRE.width * (k % 2 ? 1 : -1),

    if (!this.ready) return;
    const camPos = camera.position;
    const f = focus.value;
    for (let i = 0; i < this.mappers.length; i++) {
      const m = this.mappers[i];
      const { theta } = m.qubit.thetaPhi();
      const t01 = clamp01(theta / Math.PI);

      const freq = t01 <= 0.5
        ? lerp(m.range.high, m.range.mid, t01 / 0.5)
        : lerp(m.range.mid, m.range.low, (t01 - 0.5) / 0.5);

    if (axis === 'y')      pts.push(new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius));
    else if (axis === 'x') pts.push(new THREE.Vector3(0, Math.cos(a) * radius, Math.sin(a) * radius));

    l.position.y = lat; g.add(l);

  for (let rowFromPositiveZ = 0; rowFromPositiveZ < 4; rowFromPositiveZ++) {
    for (let colFromNegativeX = 0; colFromNegativeX < 4; colFromNegativeX++) {

      const onCentreLayer = Math.abs(y) < 1e-5;
      const isV79   = onCentreLayer && rowFromPositiveZ === 2 && colFromNegativeX === 2;

      const unityX = (colFromNegativeX - 2) * CFG.spacing;
      const pos = new THREE.Vector3(unityX * MIRROR_X, y, (2 - rowFromPositiveZ) * CFG.spacing);

      if (isV79) {

      const q = new Qubit({
        position: pos, scale: CFG.cellScale, special: false,
        rotationDuration: 0.38 + 0.025 * (index % 3),

});
themeLabel();
const elSteerBtn = document.getElementById('steer');
elSteerBtn.addEventListener('pointerdown', e => e.stopPropagation());
elSteerBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (started) setControl(!control.active, true);
  elSteerBtn.blur();
});
elSound.addEventListener('pointerdown', e => e.stopPropagation());
elSound.addEventListener('click', e => {
  e.stopPropagation();
  const m = !audio.muted;
  audio.setSession(m ? 'ambient' : 'playback');
  if (audio.ctx && audio.ctx.state !== 'running') audio.ctx.resume();
  audio.setMuted(m);
  if (!m && !audio.ready) audio.boot().catch(err => console.warn('Audio unavailable:', err));
  elSound.classList.toggle('muted', m);
  elSound.setAttribute('aria-label', m ? 'Turn sound on' : 'Turn sound off');
  elSound.title = m ? 'Sound off' : 'Sound on';
  elSound.blur();
});
async function start() {
  if (started) return;
  started = true;
  audio.unlock();
  boot.classList.add('gone');
  setTimeout(() => boot.remove(), 700);
  document.getElementById('title').classList.add('on');
  document.getElementById('legend').classList.add('on');
  elSound.classList.add('on');
  elSteerBtn.classList.add('on', 'invite');
  if (touchUI()) setTimeout(() => {
    if (!control.active) showHint('Drag to orbit · Pinch to zoom<br>Lower left button steers a sphere', 6500);
  }, 1500);
  startAutonomy();
  try { await audio.boot(); }
  catch (err) { console.warn('Audio unavailable:', err); }
  if (audio.ctx && audio.ctx.state === 'suspended') await audio.ctx.resume();
}
boot.addEventListener('click', start, { once: true });

const reviveAudio = () => {
  if (audio.ctx && !audio.muted && audio.ctx.state !== 'running') audio.ctx.resume().catch(() => {});
};
document.addEventListener('visibilitychange', () => { if (!document.hidden) reviveAudio(); });
addEventListener('pointerdown', reviveAudio, true);
addEventListener('keydown', e => { if (!ARROWS.includes(e.code)) start(); });

tick();
</script>
</body>
</html>
